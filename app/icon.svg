<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    Favicon: pôr do sol no safari — sol, colinas e uma acácia em contraluz.
    Cores espelham os tokens de app/globals.css (céu, sol, colinas, acácia).
    São valores de imagem, não de componente: um SVG não lê o :root.
  -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0a24a"/>
      <stop offset="0.6" stop-color="#8a4a28"/>
      <stop offset="1" stop-color="#2a1a10"/>
    </linearGradient>
    <clipPath id="r"><rect width="32" height="32" rx="7"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="32" height="32" fill="url(#sky)"/>
    <circle cx="21" cy="12" r="6" fill="#ffe6b0"/>
    <!-- colinas -->
    <path d="M0 24 Q 10 20 18 24 T 32 23 V32 H0 Z" fill="#5a3016"/>
    <path d="M0 28 Q 12 25 22 28 T 32 28 V32 H0 Z" fill="#2a1810"/>
    <!-- acácia -->
    <g fill="none" stroke="#160f08" stroke-width="1.4" stroke-linecap="round">
      <path d="M8 25 V17"/>
      <path d="M8 20 l-4 -2 M8 19 l5 -3"/>
    </g>
    <path d="M2 16 q6 -4 12 0 q-6 2 -12 0 z" fill="#160f08"/>
  </g>
</svg>
